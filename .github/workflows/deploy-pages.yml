name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to GitHub Pages, so there is a live link the owner can
# open without cloning the repo or running anything locally. Runs after every push to main —
# i.e. after every PR merges — so the live site never lags behind what actually got merged.
on:
  push:
    branches: [main]
  # Lets the deployment be re-run by hand from the Actions tab without a new commit.
  workflow_dispatch:

# Grants this workflow needs to publish to Pages; nothing else in the repo gets these.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a second push while one is running waits rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
