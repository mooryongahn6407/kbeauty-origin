name: CI

# Runs the same checks CLAUDE.md's Commands section lists, on every pull request and on every
# push to main — so a regression is caught before merge, not reported after the fact by
# whoever happens to run `npm test` locally next.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: typecheck, test, build, verify:sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify data/source/ matches the official workbooks
        run: npm run verify:sources
